name: Installateur Linux

# Construit le paquet GotoAndrivet.deb et Install_Goto_Universal (install_linux.py en un seul exécutable),
# et les publie dans la version « installateur », derrière des liens stables :
#   https://github.com/jbandrivet/goto_mega/releases/latest/download/GotoAndrivet.deb
#   https://github.com/jbandrivet/goto_mega/releases/latest/download/Install_Goto_Universal
# Tous deux téléchargent la dernière version de main au moment d'installer : ils n'ont besoin d'être
# reconstruits que si l'installateur lui-même change.
on:
  push:
    branches: [ main ]
    paths: [ install_linux.py, mise_a_jour.py, outils/construire_deb.sh, icons/**, .github/workflows/installateur.yml ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installateur:
    runs-on: ubuntu-22.04        # glibc 2.35 : l'exécutable tourne aussi sur des distributions plus anciennes
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Construction
      run: |
        python -m pip install --upgrade pip pyinstaller
        pyinstaller --noconfirm --onefile --name Install_Goto_Universal install_linux.py
        sh outils/construire_deb.sh "$(date +%Y.%m.%d).${{ github.run_number }}"

    - name: Publication
      uses: softprops/action-gh-release@v2
      with:
        tag_name: installateur
        name: Installateur GotoAndrivet (Linux)
        body: |
          Installe la carte du ciel et GoTo (GotoAndrivet) et le configurateur.

          **Ubuntu et Debian, le plus simple : GotoAndrivet.deb.** Téléchargez-le ci-dessous, double-cliquez dessus : le Centre d'applications s'ouvre, cliquez sur « Installer ». Ouvrez ensuite « GotoAndrivet - Carte du ciel » depuis le menu des applications : la première fois, GotoAndrivet s'installe dans votre dossier personnel (quelques minutes), puis s'ouvre.

          **Autres distributions : Install_Goto_Universal.**
          1. Téléchargez **Install_Goto_Universal** ci-dessous.
          2. Clic droit sur le fichier → Propriétés → activez « Exécutable comme programme ».
          3. Clic droit → « Exécuter comme un programme », puis « Installer ».

          Sur les Ubuntu récents, le double-clic ne lance pas un programme téléchargé (il cherche une application dans le Centre d'applications) : passez par le clic droit.
          Autre possibilité, une seule commande dans un terminal :
          `wget -qO- https://raw.githubusercontent.com/jbandrivet/goto_mega/main/installer.sh | sh`

          L'installateur télécharge toujours la dernière version du dépôt. Ensuite, le bouton « Mise à jour » des applications suffit.
          Prérequis : `sudo apt install python3-venv python3-tk`.
        files: |
          dist/GotoAndrivet.deb
          dist/Install_Goto_Universal
        make_latest: true
