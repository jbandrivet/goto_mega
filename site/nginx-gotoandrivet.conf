# Configuration nginx du site de GotoAndrivet (/etc/nginx/sites-available/gotoandrivet).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/gotoandrivet;
    index index.html;
    charset utf-8;

    # Derrière le reverse proxy de la maison : l'adresse du vrai visiteur (journaux, compteur de visiteurs)
    set_real_ip_from 10.0.0.29;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml font/ttf;

    location / { try_files $uri $uri/ =404; }
    location /statique/ { expires 7d; }
    location /telechargements/ {
        add_header Content-Disposition attachment;
        location ~ \.deb$ { types { } default_type application/vnd.debian.binary-package; add_header Content-Disposition attachment; }
    }
    location ~ /\. { deny all; }          # fichiers d'état (.etat.json, .version)
    error_page 404 /404.html;
}
